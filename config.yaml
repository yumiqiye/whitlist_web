server:
  port: 11451
  host: "0.0.0.0"

# MCDR Whitelist API 配置
mcdr:
  api_url: "http://localhost:23333"  # MCDR 服务器地址
  token: "your_mcdr_token_here"      # MCDR API Token

# 邮箱配置 (163 邮箱)
email:
  enabled: true
  host: "smtp.163.com"
  port: 465
  secure: true
  user: "your_email@163.com"         # 你的 163 邮箱
  password: "your_smtp_auth_code"    # SMTP 授权码 (不是登录密码)
  from_name: "Minecraft 白名单系统"

# 数据库配置
database:
  path: "./whitelist.db"

# 前端配置
frontend:
  title: "Minecraft 白名单申请"
  description: "申请加入服务器白名单"

# 后台配置
admin:
  title: "白名单管理后台"
  path: "/admin"
