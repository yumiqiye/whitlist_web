<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 白名单申请</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin-bottom: 0;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-check {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-qq {
            background: linear-gradient(135deg, #12b7f5 0%, #0ea5e9 100%);
            color: white;
        }

        .btn-skin {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-check:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .info-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
            display: none;
        }

        .info-card.show {
            display: block;
        }

        .qq-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .qq-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #12b7f5;
        }

        .skin-preview {
            text-align: center;
        }

        .skin-preview img {
            max-width: 100%;
            border-radius: 10px;
            background: #f0f0f0;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #d1fae5;
            color: #065f46;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #059669;
        }

        .alert-error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #dc2626;
        }

        .alert.show {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Minecraft 白名单申请</h1>
        <p class="subtitle">填写信息申请加入服务器</p>

        <div id="alert" class="alert"></div>

        <form id="applyForm">
            <div class="form-group">
                <label for="qqNumber">QQ 号码 *</label>
                <input type="number" id="qqNumber" required placeholder="请输入您的 QQ 号">
            </div>

            <div class="btn-group">
                <button type="button" class="btn-check btn-qq" onclick="checkQQ()">
                    🔍 查询 QQ 信息
                </button>
            </div>

            <div id="qqInfoCard" class="info-card">
                <div class="qq-info">
                    <img id="qqAvatar" class="qq-avatar" src="" alt="QQ 头像">
                    <div>
                        <p><strong>昵称：</strong><span id="qqNickname">-</span></p>
                        <p><strong>QQ：</strong><span id="qqNumDisplay">-</span></p>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="minecraftId">Minecraft ID *</label>
                <input type="text" id="minecraftId" required placeholder="请输入您的游戏 ID">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="isPremium" onchange="toggleSkinButton()">
                <label for="isPremium">我是正版玩家</label>
            </div>

            <div class="btn-group hidden" id="skinBtnGroup">
                <button type="button" class="btn-check btn-skin" onclick="checkSkin()">
                    🎨 查看皮肤预览
                </button>
            </div>

            <div id="skinCard" class="info-card skin-preview">
                <img id="skinImage" src="" alt="皮肤预览">
            </div>

            <button type="submit" class="btn-submit">
                📤 提交申请
            </button>
        </form>

        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #eee;">
            <p style="text-align: center; color: #666; font-size: 14px;">
                管理员入口：<a href="/admin" style="color: #667eea; text-decoration: none;">前往后台管理</a>
            </p>
        </div>
    </div>

    <script>
        let qqChecked = false;
        let skinChecked = false;

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type} show`;
            alert.textContent = message;
            setTimeout(() => {
                alert.classList.remove('show');
            }, 5000);
        }

        async function checkQQ() {
            const qqNumber = document.getElementById('qqNumber').value;
            if (!qqNumber) {
                showAlert('请先输入 QQ 号', 'error');
                return;
            }

            const btn = document.querySelector('.btn-qq');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 查询中...';

            try {
                const response = await fetch(`/api/qq-info?qq=${qqNumber}`);
                const data = await response.json();

                if (data.face) {
                    document.getElementById('qqAvatar').src = data.face;
                    document.getElementById('qqNickname').textContent = data.nickname || '未知';
                    document.getElementById('qqNumDisplay').textContent = qqNumber;
                    document.getElementById('qqInfoCard').classList.add('show');
                    qqChecked = true;
                    showAlert('QQ 信息查询成功', 'success');
                } else {
                    showAlert('未查询到 QQ 信息', 'error');
                }
            } catch (error) {
                showAlert('查询失败，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🔍 查询 QQ 信息';
            }
        }

        function toggleSkinButton() {
            const isPremium = document.getElementById('isPremium').checked;
            const skinBtnGroup = document.getElementById('skinBtnGroup');
            if (isPremium) {
                skinBtnGroup.classList.remove('hidden');
            } else {
                skinBtnGroup.classList.add('hidden');
                document.getElementById('skinCard').classList.remove('show');
                skinChecked = false;
            }
        }

        async function checkSkin() {
            const minecraftId = document.getElementById('minecraftId').value;
            if (!minecraftId) {
                showAlert('请先输入 Minecraft ID', 'error');
                return;
            }

            const btn = document.querySelector('.btn-skin');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 加载中...';

            try {
                const response = await fetch(`/api/skin-preview?username=${encodeURIComponent(minecraftId)}`);
                const data = await response.json();

                if (data.previewUrl) {
                    document.getElementById('skinImage').src = data.previewUrl;
                    document.getElementById('skinCard').classList.add('show');
                    skinChecked = true;
                    showAlert('皮肤加载成功', 'success');
                }
            } catch (error) {
                showAlert('皮肤加载失败，请检查 ID 是否正确', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '🎨 查看皮肤预览';
            }
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const qqNumber = document.getElementById('qqNumber').value;
            const minecraftId = document.getElementById('minecraftId').value;
            const isPremium = document.getElementById('isPremium').checked;

            if (!qqNumber || !minecraftId) {
                showAlert('请填写完整信息', 'error');
                return;
            }

            const btn = document.querySelector('.btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading"></span> 提交中...';

            try {
                const response = await fetch('/api/apply', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        qq_number: qqNumber,
                        minecraft_id: minecraftId,
                        is_premium: isPremium
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showAlert('申请已提交！请等待管理员审核，结果将发送到您的 QQ 邮箱', 'success');
                    document.getElementById('applyForm').reset();
                    document.getElementById('qqInfoCard').classList.remove('show');
                    document.getElementById('skinCard').classList.remove('show');
                    document.getElementById('skinBtnGroup').classList.add('hidden');
                    qqChecked = false;
                    skinChecked = false;
                } else {
                    showAlert(result.error || '提交失败', 'error');
                }
            } catch (error) {
                showAlert('提交失败，请重试', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '📤 提交申请';
            }
        });
    </script>
</body>
</html>
